version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Stock Engine — Docker Compose
#
#  Services:
#    db        — PostgreSQL 16  (persistent storage)
#    redis     — Redis 7        (Celery broker / cache)
#    engine    — Pipeline worker (runs the nightly scan)
#
#  Usage:
#    docker compose up -d db redis      # start supporting services
#    docker compose run --rm engine     # trigger a manual pipeline run
# ─────────────────────────────────────────────────────────────────────────────

services:

  db:
    image: postgres:16-alpine
    container_name: stock_engine_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       quant_engine
      POSTGRES_USER:     engine_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine_admin -d quant_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stock_engine_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_engine_pipeline
    env_file: .env
    environment:
      DATABASE_URL: postgresql://engine_admin:${DB_PASSWORD:-changeme}@db:5432/quant_engine
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command: python -m pipeline.run_pipeline
    profiles:
      - pipeline   # only runs when explicitly called

volumes:
  postgres_data:
    driver: local
