xt 12 months for APH.\n\n---\n\n## SECTION 4 \u2014 GOVERNMENT & REGULATORY ACTION IMPACT\n\n**NO EXPLICIT GOVERNMENT ACTIONS in recent_news.** However, **TARIFF RISK IS ACUTE and FORWARD-LOOKING:**\n\nFrom headline 9 (Corning earnings, sentiment=-0.711): \"tariffs pose risks\" \u2014 this is a direct reference to U.S.\u2013China trade policy.\n\n**TARIFF MECHANISM (APH-specific):**\n- Amphenol manufactures connectors in China, Mexico, and the U.S. (per company description: \"operates in the United States, China, and internationally\").\n- Assume ~40\u201350% of APH's $8.8B Q2 2026 revenue is sourced from China or contains China-origin components (connectors, printed circuit board substrates, rare-earth materials in shielding).\n- Current U.S. tariffs on electronics: 0\u201310% (varies by product code). If the incoming administration (2026/2027) implements 25% across-the-board China tariffs (as proposed in political discourse), APH's COGS would rise by:\n  - 50% of COGS \u00d7 25% tariff = 12.5% increase on half of COGS.\n  - APH's COGS = (100% - gross_margin%) \u00d7 revenue = (100% - 38.95%) \u00d7 $8.8B = ~$5.35B.\n  - 12.5% increase on $5.35B = **$668.75M incremental COGS**.\n  - At current net margin of 17.73%, this tariff increase compresses net margin to approximately 12\u201313%, a **410\u2013570 bps headwind**, or ~**$75\u201395M annual EPS impact** (~$1.00\u20131.20 per share at 75\u201380M share count estimate).\n  - Stock re-rating: 40.57x P/E \u00d7 $1.10 EPS impact = **-44.6x impact**, or **-$1.10 / $81.17 = -1.4% immediate, but -3\u20135% if tariffs are phased in**.\n\n**TIMELINE:** Tariff risk is FORWARD-LOOKING and NOT YET IN CONSENSUS ESTIMATES. If a new administration announces tariffs in Q1 2027, APH's 2027 guidance WILL require a 5\u201310% EPS cut, triggering a 20\u201330% stock correction.\n\n**REGULATORY RISK \u2014 CHIPS ACT & EXPORT CONTROLS:**\n- APH's high-end RF/microwave connectors serve U.S. defense and aerospace (part of Harsh Environ     .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h2>$1</h2>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/^[-*•] (.+)$/gm,'<li>$1</li>')
    .replace(/(<\/li>\n<li>)/g,'$1')
    .replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n{2,}/g,'</p><p>')
    .replace(/\n/g,'<br>');
}
// ── Bull/Bear thesis renderer — stamps inline styles on all headings ──────────
// marked.js emits <h3 id="section-1-…"> (with id attributes), so CSS rules can
// lose to specificity ties.  Inline style always wins — belt-and-suspenders.
const _HDR_STYLE = 'font-size:0.72rem;font-weight:700;text-transform:uppercase;'
  + 'letter-spacing:0.8px;color:var(--muted);margin-top:18px;padding-top:12px;'
  + 'border-top:1px solid rgba(255,255,255,0.07)';
// Wrap every <table> produced by marked.js in a .tbl-scroll div so metric /
// valuation tables inside thesis panels scroll horizontally on mobile.
function _wrapTables(html) {
  return html.replace(/<table>/gi,  '<div class="tbl-scroll" style="margin:6px 0"><table>')
             .replace(/<\/table>/gi, '</table></div>');
}
function thesisContent(text) {
  if (!text) return '';
  let html = md(text);
  html = html.replace(/<h[123]([^>]*)>/gi, '<h3$1 style="' + _HDR_STYLE + '">')
             .replace(/<\/h[123]>/gi, '</h3>');
  return _wrapTables(html);
}
// ── Risk-manager memo renderer ─────────────────────────────────────────────────
// Extracts the opening VERDICT line and renders it as a colored callout banner,
// then renders the remainder of the memo normally.
function memoContent(memo) {
  if (!memo) return '';
  const s = String(memo);
  // Match: [APPROVED] — ... or APPROVED — ... on a line by itself
  const vm = s.match(/^(\[?(APPROVED|WATCH|REJECTED)\]?\s*[—–\-][^\n]*)/m);
  if (vm) {
    const verdict = vm[2].toUpperCase();
    const cls = verdict === 'APPROVED' ? 'approved' : verdict === 'REJECTED' ? 'rejected' : 'watch';
    const callout = '<div class="verdict-callout verdict-callout-' + cls + '">' + vm[1].trim() + '</div>';
    const body = s.slice(vm.index + vm[0].length).trimStart();
    return _wrapTables(callout + md(body));
  }
  return _wrapTables(md(s));
}

function fmtDate(d) {
  if (!d) return '';
  const s = String(d);
  // Convert Unix timestamp (10 digits) to YYYY-MM-DD
  if (/^\d{10}$/.test(s)) {
    return new Date(parseInt(s) * 1000).toISOString().slice(0, 10);
  }
  return s.slice(0, 10);
}

// ── Formatters ────────────────────────────────────────────────────────────────
const fmt$ = v => v == null ? '—' : '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
const fmtPnl = v => {
  if (v == null) return '—';
  const s = v >= 0 ? '+' : '';
  return s + '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
};
const fmtPct = v => v == null ? '' : ` (${v >= 0 ? '+' : ''}${Number(v).toFixed(1)}%)`;
const colorClass = v => v > 0 ? 'positive' : v < 0 ? 'negative' : 'neutral';
const badge = (verdict) => {
  if (!verdict) return '';
  const cls = verdict.toLowerCase();
  return `<span class="badge badge-${cls}">${verdict}</span>`;
};
const dirBadge = dir => `<span class="badge badge-${dir?.toLowerCase()}">${dir}</span>`;

// ── Header cards ──────────────────────────────────────────────────────────────
document.getElementById('last-updated').textContent =
  'Updated ' + new Date(D.generated_at).toLocaleString('en-US', {timeZone:'America/New_York', dateStyle:'medium', timeStyle:'short'}) + ' ET';

const equity = port.total_equity || 0;
const pnl    = port.cumulative_pnl || 0;
document.getElementById('equity').textContent = fmt$(equity);
document.getElementById('equity').className   = 'card-value';

document.getElementById('cash').textContent   = fmt$(port.cash);
document.getElementById('open-pos').textContent = `${(port.positions||[]).length} open position${(port.positions||[]).length !== 1 ? 's' : ''}`;

const pnlEl = document.getElementById('cum-pnl');
pnlEl.textContent  = fmtPnl(pnl);
pnlEl.className    = 'card-value ' + colorClass(pnl);

const dailyR = today.realized_pnl || 0;
const dailyU = today.unrealized_pnl || 0;
document.getElementById('daily-pnl').textContent = `Today: ${fmtPnl(dailyR + dailyU)}`;

const wr = D.win_rate || 0;
document.getElementById('win-rate').textContent = wr.toFixed(0) + '%';
document.getElementById('win-rate').className   = 'card-value ' + colorClass(wr - 50);
document.getElementById('win-bar-fill').style.width = Math.min(wr, 100) + '%';

// ── Equity Curve Chart ────────────────────────────────────────────────────────
if (curve && curve.length > 0) {
  const labels = curve.map(c => c.date);
  const baseline = 150000;
  // Prefer total_equity when recorded; fall back to baseline + cumulative_pnl
  const equities = curve.map(c => c.total_equity != null ? c.total_equity : baseline + (c.cumulative_pnl || 0));

  window._eqChart = new Chart(document.getElementById('equity-chart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Portfolio Equity',
        data: equities,
        borderColor: '#58a6ff',
        backgroundColor: 'rgba(88,166,255,0.08)',
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        fill: true,
        tension: 0.3,
      }, {
        label: 'Baseline $150k',
        data: labels.map(() => baseline),
        borderColor: 'rgba(125,133,144,0.4)',
        borderWidth: 1,
        borderDash: [4, 4],
        pointRadius: 0,
        fill: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#161b22',
          borderColor: '#30363d',
          borderWidth: 1,
          callbacks: {
            label: ctx => ' ' + fmt$(ctx.raw),
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(48,54,61,0.5)' },
          ticks: { color: '#7d8590', maxTicksLimit: 6, font: { size: 11 } }
        },
        y: {
          grid: { color: 'rgba(48,54,61,0.5)' },
          ticks: { color: '#7d8590', font: { size: 11 }, callback: v => fmt$(v) }
        }
      }
    }
  });
} else {
  document.getElementById('equity-chart').parentElement.innerHTML =
    '<div class="empty-state">No historical data yet — runs after first EOD</div>';
}

// ── Panel tab helpers ─────────────────────────────────────────────────────────
function openPanel(btn, type, grp) {
  const allTabs   = document.querySelectorAll('.panel-tab[data-grp="' + grp + '"]');
  const allBodies = document.querySelectorAll('.panel-body[data-grp="' + grp + '"]');
  const isActive  = btn.classList.contains('active');
  allTabs.forEach(t => t.classList.remove('active'));
  allBodies.forEach(b => b.classList.remove('active'));
  if (!isActive) {
    btn.classList.add('active');
    const body = document.getElementById(type + '-' + grp);
    if (body) body.classList.add('active');
  }
}

// ── News helpers ──────────────────────────────────────────────────────────────
function renderNewsItem(n) {
  const sc  = n.sentiment || 0;
  const cls = sc > 0.05 ? 'news-positive' : sc < -0.05 ? 'news-negative' : 'news-neutral';
  const lbl = sc > 0.05 ? '▲ ' + sc.toFixed(2) : sc < -0.05 ? '▼ ' + Math.abs(sc).toFixed(2) : '● ' + sc.toFixed(2);
  const href = n.url || ('https://duckduckgo.com/?q=' + encodeURIComponent(n.headline || ''));
  const hl   = `<a href="${href}" target="_blank" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)">${n.headline || ''}</a>`;
  return `<div class="news-item">
    <span class="news-sentiment ${cls}">${lbl}</span>
    <div class="news-body">
      <div class="news-headline">${hl}</div>
      <div class="news-meta">${n.source || ''}${n.published ? ' · ' + fmtDate(n.published) : ''}</div>
    </div>
  </div>`;
}
function newsItems(articles) {
  if (!articles || !articles.length) return '';
  return '<div class="news-list">' + articles.slice(0, 10).map(renderNewsItem).join('') + '</div>';
}

// ── Live price fetch via Finnhub (CORS-enabled) ───────────────────────────────
function _applyQuotes(quotes) {
  let unrealized = 0;
  let mktValue   = 0;
  quotes.forEach(q => {
    const el     = document.getElementById('lp-' + q.symbol);
    const entry  = parseFloat(el?.dataset.entry  || '0');
    const shares = parseFloat(el?.dataset.shares || '0');
    if (!el || q.price == null) return;
    const price = q.price;
    // Update table row price
    el.textContent = '$' + price.toFixed(2);
    el.className   = 'mono ' + (price >= entry ? 'positive' : 'negative');
    // Also update mobile card price (separate ID to avoid duplicate-ID conflicts)
    const cardEl = document.getElementById('clp-' + q.symbol);
    if (cardEl) {
      cardEl.textContent = '$' + price.toFixed(2);
      cardEl.className   = 'pos-price-val mono ' + (price >= entry ? 'positive' : 'negative');
    }
    if (entry && shares) {
      unrealized += (price - entry) * shares;
      mktValue   += price * shares;
    }
  });
  if (!mktValue) return;
  const cash       = port.cash || 0;
  const liveEquity = cash + mktValue;
  // port.cumulative_pnl is set by mark_to_market() as (total_equity − TOTAL_CAPITAL),
  // which already folds in unrealized P&L from the last EOD close.  Adding fresh
  // unrealized on top would double-count it.  Derive total P&L purely from live equity.
  const totalPnl   = liveEquity - (port.total_capital || 150000);
  document.getElementById('equity').textContent = fmt$(liveEquity);
  const pnlEl = document.getElementById('cum-pnl');
  pnlEl.textContent = fmtPnl(totalPnl);
  pnlEl.className   = 'card-value ' + colorClass(totalPnl);
  const subEl = document.getElementById('equity-sub');
  if (subEl) subEl.textContent = 'Unrealized: ' + fmtPnl(unrealized);
  // Update today's (last) point on the equity curve chart
  if (window._eqChart) {
    const ds = window._eqChart.data.datasets[0];
    ds.data[ds.data.length - 1] = liveEquity;
    window._eqChart.update('none');
  }
}
async function fetchLivePrices(syms) {
  const key = window.__FH_KEY__;
  if (!syms.length || !key) return;
  // Finnhub allows CORS from any origin — one request per symbol, all in parallel
  const results = await Promise.allSettled(
    syms.map(sym =>
      fetch('https://finnhub.io/api/v1/quote?symbol=' + sym + '&token=' + key)
        .then(r => r.ok ? r.json() : null)
        .then(d => d && d.c ? { symbol: sym, price: d.c } : null)
    )
  );
  const quotes = results
    .filter(r => r.status === 'fulfilled' && r.value)
    .map(r => r.value);
  if (quotes.length) _applyQuotes(quotes);
}

// ── Open Positions — card (mobile) + table (desktop) ─────────────────────────
const positions = port.positions || [];
const posEl = document.getElementById('positions-container');
if (positions.length > 0) {
  // Build shared data per position once, reuse in both views
  const posRows = positions.map((p, pidx) => {
    const entry      = Number(p.entry_price);
    const stored     = p.current_price != null ? Number(p.current_price) : null;
    const cost       = p.shares * entry;
    const curCls     = stored == null ? '' : stored >= entry ? 'positive' : 'negative';
    const curTxt     = stored == null ? '…' : '$' + stored.toFixed(2);
    const verdictCls = 'verdict-' + (p.verdict || 'watch').toLowerCase();
    const grp        = `pos-${pidx}`;
    const cgrp       = `cpos-${pidx}`;  // card-scoped IDs — no DOM conflicts
    const stopTxt    = p.stop_loss ? '$' + Number(p.stop_loss).toFixed(2) : '—';
    const tgtTxt     = p.target    ? '$' + Number(p.target).toFixed(2)    : '—';
    const scoreTxt   = p.composite_score ? Number(p.composite_score).toFixed(1) : '—';
    // Reusable panel HTML builder (works for both table rows and cards)
    const mkPanels = g => `
      <div class="panel-bar">
        ${p.bull_thesis ? `<button class="panel-tab bull-tab" data-grp="${g}" onclick="openPanel(this,'bull','${g}')" type="button">Bull case</button>` : ''}
        ${p.bear_risks  ? `<button class="panel-tab bear-tab" data-grp="${g}" onclick="openPanel(this,'bear','${g}')" type="button">Bear risks</button>` : ''}
        ${p.full_memo   ? `<button class="panel-tab memo-tab" data-grp="${g}" onclick="openPanel(this,'memo','${g}')" type="button">Risk Manager Verdict</button>` : ''}
        ${(p.full_news && p.full_news.length) ? `<button class="panel-tab news-tab" data-grp="${g}" onclick="openPanel(this,'news','${g}')" type="button">News (${p.full_news.length})</button>` : ''}
      </div>
      ${p.bull_thesis ? `<div class="panel-body thesis thesis-bull md" id="bull-${g}" data-grp="${g}">${thesisContent(p.bull_thesis)}</div>` : ''}
      ${p.bear_risks  ? `<div class="panel-body thesis thesis-bear md" id="bear-${g}" data-grp="${g}">${thesisContent(p.bear_risks)}</div>` : ''}
      ${p.full_memo   ? `<div class="panel-body thesis thesis-memo md" id="memo-${g}" data-grp="${g}">${memoContent(p.full_memo)}</div>` : ''}
      ${(p.full_news && p.full_news.length) ? `<div class="panel-body" id="news-${g}" data-grp="${g}">${newsItems(p.full_news)}</div>` : ''}`;
    return { p, entry, cost, curCls, curTxt, verdictCls, grp, cgrp,
              stopTxt, tgtTxt, scoreTxt, mkPanels };
  });

  // ── Mobile card view (shown at ≤640px via CSS) ──────────────────────────
  const cardsHtml = posRows.map(r => {
    const { p, entry, cost, curCls, curTxt, verdictCls, cgrp, stopTxt, tgtTxt, scoreTxt, mkPanels } = r;
    return `
    <div class="pos-card ${verdictCls}">
      <div class="pos-card-top">
        <div style="display:flex;align-items:center;gap:8px">
          <a href="https://finance.yahoo.com/quote/${p.symbol}" target="_blank" class="pos-card-sym">${p.symbol}</a>
          ${dirBadge(p.direction)}
        </div>
        <span style="font-size:0.72rem;color:var(--muted)">Score ${scoreTxt}</span>
      </div>
      <div class="pos-prices">
        <div><span class="pos-price-lbl">Entry</span><span class="pos-price-val mono">$${entry.toFixed(2)}</span></div>
        <div><span class="pos-price-lbl">Current</span><span class="pos-price-val mono ${curCls}" id="clp-${p.symbol}" data-entry="${entry}" data-shares="${p.shares}">${curTxt}</span></div>
        <div><span class="pos-price-lbl">Stop</span><span class="pos-price-val mono">${stopTxt}</span></div>
        <div><span class="pos-price-lbl">Target</span><span class="pos-price-val mono">${tgtTxt}</span></div>
      </div>
      <div class="pos-card-meta">${p.shares} sh · $${cost.toLocaleString('en-US',{maximumFractionDigits:0})} · ${p.entry_date || '—'}</div>
      <div class="reason">${p.reason || ''}</div>
      ${mkPanels(cgrp)}
    </div>`;
  }).join('');

  // ── Desktop table view (hidden at ≤640px via CSS) ────────────────────────
  const tableHtml = `<table>
    <thead><tr>
      <th>Symbol</th><th>Direction</th><th>Shares</th>
      <th>Cost</th><th>Entry</th><th>Current</th><th>Stop</th><th>Target</th><th>Score</th><th>Entered</th>
    </tr></thead>
    <tbody>
    ${posRows.map(r => {
      const { p, entry, cost, curCls, curTxt, verdictCls, grp, stopTxt, tgtTxt, scoreTxt, mkPanels } = r;
      return `
      <tr class="${verdictCls}">
        <td><strong><a href="https://finance.yahoo.com/quote/${p.symbol}" target="_blank" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)">${p.symbol}</a></strong></td>
        <td>${dirBadge(p.direction)}</td>
        <td class="mono">${p.shares}</td>
        <td class="mono">$${cost.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}</td>
        <td class="mono">$${entry.toFixed(2)}</td>
        <td class="mono ${curCls}" id="lp-${p.symbol}" data-entry="${entry}" data-shares="${p.shares}">${curTxt}</td>
        <td class="mono">${stopTxt}</td>
        <td class="mono">${tgtTxt}</td>
        <td>${scoreTxt}</td>
        <td>${p.entry_date || '—'}</td>
      </tr>
      <tr class="thesis-row"><td colspan="10">
        <div class="reason">${p.reason || ''}</div>
        ${mkPanels(grp)}
      </td></tr>`;
    }).join('')}
    </tbody>
  </table>`;

  posEl.innerHTML =
    `<div class="pos-mobile">${cardsHtml}</div>` +
    `<div class="pos-desktop tbl-scroll">${tableHtml}</div>`;

  fetchLivePrices(positions.map(p => p.symbol));
}

// ── Trade Log helpers ─────────────────────────────────────────────────────────
function renderEntries(entries, container) {
  if (!entries || entries.length === 0) {
    container.innerHTML = '<div class="empty-state">No entries</div>';
    return;
  }
  container.innerHTML = `<div class="tbl-scroll"><table>
    <thead><tr>
      <th>Date</th><th>Symbol</th><th>Verdict</th><th>Shares</th><th>Entry $</th><th>Cost</th><th>Stop</th><th>Target</th>
    </tr></thead>
    <tbody>
    ${entries.map((e, eidx) => {
      const grp = `ent-${eidx}`;
      return `
      <tr class="verdict-${(e.verdict || 'watch').toLowerCase()}">
        <td style="color:var(--muted);font-size:0.8rem">${e._date || e.entry_date || '—'}</td>
        <td><strong>${e.symbol}</strong> ${dirBadge(e.direction)}</td>
        <td>${badge(e.verdict)}</td>
        <td class="mono">${e.shares}</td>
        <td class="mono">$${Number(e.entry_price).toFixed(2)}</td>
        <td class="mono">$${e.cost ? Number(e.cost).toLocaleString('en-US', {maximumFractionDigits:0}) : '—'}</td>
        <td class="mono">${e.stop_loss ? '$' + Number(e.stop_loss).toFixed(2) : '—'}</td>
        <td class="mono">${e.target    ? '$' + Number(e.target).toFixed(2)    : '—'}</td>
      </tr>
      ${(e.reason || e.bull_thesis) ? `
      <tr class="thesis-row"><td colspan="8">
        <div class="reason">${e.reason || ''}</div>
        <div class="panel-bar">
          ${e.bull_thesis ? `<button class="panel-tab bull-tab" data-grp="${grp}" onclick="openPanel(this,'bull','${grp}')" type="button">Bull case</button>` : ''}
          ${e.bear_risks  ? `<button class="panel-tab bear-tab" data-grp="${grp}" onclick="openPanel(this,'bear','${grp}')" type="button">Bear risks</button>` : ''}
          ${e.full_memo   ? `<button class="panel-tab memo-tab" data-grp="${grp}" onclick="openPanel(this,'memo','${grp}')" type="button">Risk Manager Verdict</button>` : ''}
          ${(e.full_news && e.full_news.length) ? `<button class="panel-tab news-tab" data-grp="${grp}" onclick="openPanel(this,'news','${grp}')" type="button">News (${e.full_news.length})</button>` : ''}
        </div>
        ${e.bull_thesis ? `<div class="panel-body thesis thesis-bull md" id="bull-${grp}" data-grp="${grp}">${thesisContent(e.bull_thesis)}</div>` : ''}
        ${e.bear_risks  ? `<div class="panel-body thesis thesis-bear md" id="bear-${grp}" data-grp="${grp}">${thesisContent(e.bear_risks)}</div>` : ''}
        ${e.full_memo   ? `<div class="panel-body thesis thesis-memo md" id="memo-${grp}" data-grp="${grp}">${memoContent(e.full_memo)}</div>` : ''}
        ${(e.full_news && e.full_news.length) ? `<div class="panel-body" id="news-${grp}" data-grp="${grp}">${newsItems(e.full_news)}</div>` : ''}
      </td></tr>` : ''}
      `;
    }).join('')}
    </tbody>
  </table></div>`;
}

function renderExits(exits, container) {
  if (!exits || exits.length === 0) {
    container.innerHTML = '<div class="empty-state">No exits</div>';
    return;
  }
  container.innerHTML = `<div class="tbl-scroll"><table>
    <thead><tr>
      <th>Symbol</th><th>Dir</th><th>Shares</th><th>Entry $</th><th>Exit $</th><th>P&amp;L $</th><th>P&amp;L %</th><th>Reason</th>
    </tr></thead>
    <tbody>
    ${exits.map(e => {
      const pnl = e.pnl_dollars || 0;
      const cls = colorClass(pnl);
      return `
        <tr>
          <td><strong>${e.symbol}</strong></td>
          <td>${dirBadge(e.direction)}</td>
          <td class="mono">${e.shares}</td>
          <td class="mono">$${Number(e.entry_price).toFixed(2)}</td>
          <td class="mono">$${Number(e.exit_price).toFixed(2)}</td>
          <td class="mono ${cls}">${fmtPnl(pnl)}</td>
          <td class="mono ${cls}">${fmtPct(e.pnl_pct)}</td>
          <td style="color:var(--muted);font-size:0.8rem">${e.reason || '—'}</td>
        </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}

function renderRecentTrades(trades, container) {
  if (!trades || trades.length === 0) {
    container.innerHTML = '<div class="empty-state">No recent trades</div>';
    return;
  }
  const exits   = trades.filter(t => t._type === 'exit').slice(0, 50);
  const entries = trades.filter(t => t._type === 'entry').slice(0, 50);
  if (exits.length > 0) {
    // Show exits with P&L when available
    renderExits(exits, container);
  } else if (entries.length > 0) {
    // Fall back to showing entries if no exits yet
    renderEntries(entries, container);
  } else {
    container.innerHTML = '<div class="empty-state">No recent trades</div>';
  }
}

// ── Render trade tabs ─────────────────────────────────────────────────────────
const todayEntries = today.entries || [];
const todayExits   = today.exits   || [];

renderEntries(todayEntries, document.getElementById('entries-container'));
renderExits(todayExits,     document.getElementById('exits-container'));

renderRecentTrades(recent, document.getElementById('recent-container'));

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}
