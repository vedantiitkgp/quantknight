<style>

  .md h4 { font-size: 0.8rem; font-weight: 600; margin: 8px 0 2px; color: var(--text); }
  /* Section breaks inside thesis cards — separator above every h3 except the first */
  .thesis h3 { margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.07); }
  .thesis h3:first-child { border-top: none; margin-top: 6px; padding-top: 0; }
  .md p { margin: 4px 0 8px; }
  .md ul, .md ol { margin: 4px 0 8px; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md strong { color: var(--text); }
  .md em { opacity: 0.85; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .md table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin: 6px 0; }
  .md th { background: rgba(255,255,255,0.04); padding: 4px 8px; text-align: left; border: 1px solid var(--border); }
  .md td { padding: 4px 8px; border: 1px solid var(--border); }
  .md code { background: rgba(88,166,255,0.1); color: var(--blue); border: 1px solid rgba(88,166,255,0.2); padding: 1px 5px; border-radius: 4px; font-family: 'SF Mono', Consolas, monospace; font-size: 0.80em; white-space: nowrap; }
  /* ── Conviction keyword highlights (injected by preprocess) ── */
  mark.conv-bull    { background: rgba(63,185,80,0.15);   color: var(--green);  padding: 1px 5px; border-radius: 3px; font-weight: 700; font-style: normal; }
  mark.conv-bear    { background: rgba(248,81,73,0.15);   color: var(--red);    padding: 1px 5px; border-radius: 3px; font-weight: 700; font-style: normal; }
  mark.conv-neutral { background: rgba(125,133,144,0.12); color: var(--muted);  padding: 1px 5px; border-radius: 3px; font-weight: 700; font-style: normal; }
  /* ── Verdict callout banner at top of risk-manager memo ── */
  .verdict-callout { border-radius: 6px; padding: 10px 16px; margin-bottom: 14px; font-size: 0.84rem; line-height: 1.55; border-left: 4px solid; font-weight: 600; }
  .verdict-callout strong { color: inherit; }
  .verdict-callout-approved { background: rgba(63,185,80,0.08);  border-color: var(--green);  color: var(--green); }
  .verdict-callout-rejected  { background: rgba(248,81,73,0.08);  border-color: var(--red);    color: var(--red);   }
  .verdict-callout-watch     { background: rgba(210,153,34,0.08); border-color: var(--yellow); color: var(--yellow);}
  /* ── Section headers inside memos/thesis panels — muted small-caps ── */
  .thesis-memo h3, .thesis-memo h2, .thesis-memo h1,
  .thesis.thesis-bull h3, .thesis.thesis-bull h2, .thesis.thesis-bull h1,
  .thesis.thesis-bear h3, .thesis.thesis-bear h2, .thesis.thesis-bear h1 {
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--muted);
    margin-top: 18px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.07);
  }
  .thesis-memo h3:first-of-type, .thesis-memo h2:first-of-type, .thesis-memo h1:first-of-type,
  .thesis.thesis-bull h3:first-of-type, .thesis.thesis-bull h2:first-of-type, .thesis.thesis-bull h1:first-of-type,
  .thesis.thesis-bear h3:first-of-type, .thesis.thesis-bear h2:first-of-type, .thesis.thesis-bear h1:first-of-type {
    border-top: none; margin-top: 4px;
  }
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #30363d;
    --text:    #e6edf3;
    --muted:   #7d8590;
    --green:   #3fb950;
    --red:     #f85149;
    --yellow:  #d29922;
    --blue:    #58a6ff;
    --purple:  #bc8cff;
    --accent:  #1f6feb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* ── Header ── */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--blue); }
  .last-updated { color: var(--muted); font-size: 0.8rem; }

  /* ── Layout ── */
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; }

  /* ── Cards ── */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 768px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .card-label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .card-value { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card-sub { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .neutral  { color: var(--text); }

  /* Win rate bar */
  .win-bar { background: var(--border); border-radius: 4px; height: 6px; margin-top: 10px; overflow: hidden; }
  .win-bar-fill { height: 100%; border-radius: 4px; background: var(--green); transition: width 0.6s ease; }

  /* ── Chart ── */
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .section-title { font-size: 0.9rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
  .chart-wrap { position: relative; height: 200px; }

  /* ── Table ── */
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  th { padding: 10px 16px; text-align: left; color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  tr.verdict-approved:not(.thesis-row) td { background: rgba(63,185,80,0.05); }
  tr.verdict-watch:not(.thesis-row)    td { background: rgba(210,153,34,0.06); }
  tr.verdict-rejected:not(.thesis-row) td { background: rgba(248,81,73,0.05); }
  tr.thesis-row td { background: transparent !important; }
  .empty-state { padding: 32px; text-align: center; color: var(--muted); }

  /* ── Badges ── */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-approved { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge-watch    { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .badge-rejected { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge-long  { background: rgba(88,166,255,0.15); color: var(--blue); }
  .badge-short { background: rgba(248,81,73,0.15); color: var(--red); }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 20px; }
  .tab { padding: 12px 16px; font-size: 0.85rem; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; user-select: none; }
  .tab.active { color: var(--text); border-bottom-color: var(--blue); }
  .tab:hover:not(.active) { color: var(--text); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Reason / thesis text ── */
  .reason { color: var(--muted); font-size: 0.8rem; margin-top: 4px; line-height: 1.4; }
  .mono { font-family: 'SF Mono', SFMono-Regular, Consolas, monospace; }
  .thesis-row td { padding: 0 16px 12px 16px !important; border-bottom: 1px solid var(--border); }
  .thesis { background: rgba(31,111,235,0.05); border-left: 3px solid var(--accent); border-radius: 0 4px 4px 0; padding: 10px 14px; margin-bottom: 6px; font-size: 0.82rem; line-height: 1.55; }
  .thesis-bull { border-left-color: var(--green); }
  .thesis-bear { border-left-color: var(--red); }
  .thesis-memo { border-left-color: var(--purple); }
  .thesis-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; opacity: 0.7; }
  details summary { cursor: pointer; color: var(--blue); font-size: 0.78rem; font-weight: 600; padding: 4px 0; user-select: none; }
  details summary:hover { opacity: 0.8; }
  details[open] summary { margin-bottom: 8px; }
  /* ── Panel tab bar (horizontal row of thesis toggles) ── */
  .panel-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .panel-tab { background: none; border: 1px solid var(--border); border-radius: 12px; padding: 3px 12px; font-size: 0.75rem; font-weight: 600; cursor: pointer; color: var(--muted); transition: border-color 0.15s, color 0.15s, background 0.15s; user-select: none; }
  .panel-tab:hover { border-color: var(--text); color: var(--text); }
  .panel-tab.bull-tab.active { background: rgba(63,185,80,0.12); border-color: var(--green); color: var(--green); }
  .panel-tab.bear-tab.active { background: rgba(248,81,73,0.12); border-color: var(--red);   color: var(--red);   }
  .panel-tab.memo-tab.active { background: rgba(188,140,255,0.12); border-color: var(--purple); color: var(--purple); }
  .panel-tab.news-tab.active { background: rgba(88,166,255,0.12); border-color: var(--blue);  color: var(--blue);  }
  .panel-body { margin-top: 10px; display: none; }
  .panel-body.active { display: block; }

  /* ── News Articles ── */
  .news-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .news-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; background: rgba(255,255,255,0.02); border-radius: 6px; border: 1px solid var(--border); }
  .news-sentiment { font-size: 0.75rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
  .news-positive { background: rgba(63,185,80,0.15); color: var(--green); }
  .news-negative { background: rgba(248,81,73,0.15); color: var(--red); }
  .news-neutral  { background: rgba(125,133,144,0.15); color: var(--muted); }
  .news-body { flex: 1; min-width: 0; }
  .news-headline { font-size: 0.82rem; font-weight: 500; line-height: 1.35; }
  .news-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .news-summary { font-size: 0.78rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }

  /* ── Horizontal-scroll wrapper for wide tables ── */
  .tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ── Mobile card layout for open positions ── */
  .pos-mobile  { display: none; padding: 8px 12px 12px; }
  .pos-desktop { display: block; }
  .pos-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .pos-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .pos-card-sym { font-size: 1rem; font-weight: 700; color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .pos-prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 8px; }
  .pos-prices > div { display: flex; flex-direction: column; gap: 2px; }
  .pos-price-lbl { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
  .pos-price-val { font-size: 0.85rem; font-family: 'SF Mono', SFMono-Regular, Consolas, monospace; }
  .pos-card-meta { font-size: 0.7rem; color: var(--muted); margin-bottom: 6px; }

  @media (max-width: 640px) {
    /* Switch positions to card layout */
    .pos-mobile  { display: block; }
    .pos-desktop { display: none; }
    /* Other tables: force horizontal scroll */
    .tbl-scroll table { min-width: 560px; }
    .tbl-scroll th, .tbl-scroll td { padding: 8px 10px; font-size: 0.78rem; }
    /* Keep 2-col metric cards on landscape phones */
    .cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card  { padding: 14px; }
  }
</style>
</head>

<script>
const D = window.__DATA__;
const port   = D.portfolio;
const today  = D.today_trades;
const curve  = D.equity_curve;
const recent = D.recent_trades;

// ── Markdown + date helpers ────────────────────────────────────────────────────
function preprocess(s) {
  return s
    // ══════════ SECTION HEADER ══════════  →  ### SECTION HEADER
    .replace(/^[═─]{3,}\s*(.+?)\s*[═─]{3,}\s*$/gm, '### $1')
    // Standalone ════════  →  ---
    .replace(/^[═─]{3,}\s*$/gm, '---')
    // SECTION N — TITLE (without box chars)  →  ### SECTION N — TITLE
    .replace(/^(SECTION\s+\d+\s*[—–-]+\s*.+)$/gm, '### $1')
    // ── Conviction keyword highlights ──────────────────────────────────────
    // Bull signals: ADDS TO CONVICTION, CONFIRMS, ADDS TO
    .replace(/\b(ADDS TO CONVICTION|CONFIRMS THE BULL|CONFIRMS|ADDS TO)\b/g, m =>
      '<mark class="conv-bull">' + m + '</mark>')
    // Bear signals: DETRACTS, CONTRADICTS, UNDERMINES, REDUCES
    .replace(/\b(DETRACTS FROM THESIS|DETRACTS|CONTRADICTS THE BULL|CONTRADICTS|UNDERMINES|REDUCES CONVICTION)\b/g, m =>
      '<mark class="conv-bear">' + m + '</mark>')
    // Neutral signals
    .replace(/\b(NEUTRAL TO SLIGHTLY (?:NEGATIVE|POSITIVE)|NEUTRAL)\b/g, m =>
      '<mark class="conv-neutral">' + m + '</mark>')
    // ── Inline metric=value pills (e.g. ROIC=3.5%, peg_ratio=20.69) ────────
    .replace(/\b([a-z][a-z_]{2,})\s*=\s*([-+]?\d[\d,.]*(\s*[%×x])?)/gi,
      '<code>$1=$2</code>');
}
function md(text) {
  if (!text) return '';
  const s = preprocess(String(text));
  try {
    if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
      return marked.parse(s);
    }
  } catch(e) {}
  // Inline fallback: convert the most common LLM Markdown patterns
  return s
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^---$/gm,'<hr>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h2>$1</h2>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/^[-*•] (.+)$/gm,'<li>$1</li>')
    .replace(/(<\/li>\n<li>)/g,'$1')
    .replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n{2,}/g,'</p><p>')
    .replace(/\n/g,'<br>');
}
// ── Bull/Bear thesis renderer — stamps inline styles on all headings ──────────
// marked.js emits <h3 id="section-1-…"> (with id attributes), so CSS rules can
// lose to specificity ties.  Inline style always wins — belt-and-suspenders.
const _HDR_STYLE = 'font-size:0.72rem;font-weight:700;text-transform:uppercase;'
  + 'letter-spacing:0.8px;color:var(--muted);margin-top:18px;padding-top:12px;'
  + 'border-top:1px solid rgba(255,255,255,0.07)';
// Wrap every <table> produced by marked.js in a .tbl-scroll div so metric /
// valuation tables inside thesis panels scroll horizontally on mobile.
function _wrapTables(html) {
  return html.replace(/<table>/gi,  '<div class="tbl-scroll" style="margin:6px 0"><table>')
             .replace(/<\/table>/gi, '</table></div>');
}
function thesisContent(text) {
  if (!text) return '';
  let html = md(text);
  html = html.replace(/<h[123]([^>]*)>/gi, '<h3$1 style="' + _HDR_STYLE + '">')
             .replace(/<\/h[123]>/gi, '</h3>');
  return _wrapTables(html);
}
// ── Risk-manager memo renderer ─────────────────────────────────────────────────
// Extracts the opening VERDICT line and renders it as a colored callout banner,
// then renders the remainder of the memo normally.
function memoContent(memo) {
  if (!memo) return '';
  const s = String(memo);
  // Match: [APPROVED] — ... or APPROVED — ... on a line by itself
  const vm = s.match(/^(\[?(APPROVED|WATCH|REJECTED)\]?\s*[—–\-][^\n]*)/m);
  if (vm) {
    const verdict = vm[2].toUpperCase();
    const cls = verdict === 'APPROVED' ? 'approved' : verdict === 'REJECTED' ? 'rejected' : 'watch';
    const callout = '<div class="verdict-callout verdict-callout-' + cls + '">' + vm[1].trim() + '</div>';
    const body = s.slice(vm.index + vm[0].length).trimStart();
    return _wrapTables(callout + md(body));
  }
  return _wrapTables(md(s));
}

function fmtDate(d) {
  if (!d) return '';
  const s = String(d);
  // Convert Unix timestamp (10 digits) to YYYY-MM-DD
  if (/^\d{10}$/.test(s)) {
    return new Date(parseInt(s) * 1000).toISOString().slice(0, 10);
  }
  return s.slice(0, 10);
}

// ── Formatters ────────────────────────────────────────────────────────────────
const fmt$ = v => v == null ? '—' : '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
const fmtPnl = v => {
  if (v == null) return '—';
  const s = v >= 0 ? '+' : '';
  return s + '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
};
const fmtPct = v => v == null ? '' : ` (${v >= 0 ? '+' : ''}${Number(v).toFixed(1)}%)`;
const colorClass = v => v > 0 ? 'positive' : v < 0 ? 'negative' : 'neutral';
const badge = (verdict) => {
  if (!verdict) return '';
  const cls = verdict.toLowerCase();
  return `<span class="badge badge-${cls}">${verdict}</span>`;
};
const dirBadge = dir => `<span class="badge badge-${dir?.toLowerCase()}">${dir}</span>`;

// ── Header cards ──────────────────────────────────────────────────────────────
document.getElementById('last-updated').textContent =
  'Updated ' + new Date(D.generated_at).toLocaleString('en-US', {timeZone:'America/New_York', dateStyle:'medium', timeStyle:'short'}) + ' ET';

const equity = port.total_equity || 0;
const pnl    = port.cumulative_pnl || 0;
document.getElementById('equity').textContent = fmt$(equity);
document.getElementById('equity').className   = 'card-value';

document.getElementById('cash').textContent   = fmt$(port.cash);
document.getElementById('open-pos').textContent = `${(port.positions||[]).length} open position${(port.positions||[]).length !== 1 ? 's' : ''}`;

const pnlEl = document.getElementById('cum-pnl');
pnlEl.textContent  = fmtPnl(pnl);
pnlEl.className    = 'card-value ' + colorClass(pnl);

const dailyR = today.realized_pnl || 0;
const dailyU = today.unrealized_pnl || 0;
document.getElementById('daily-pnl').textContent = `Today: ${fmtPnl(dailyR + dailyU)}`;

const wr = D.win_rate || 0;
document.getElementById('win-rate').textContent = wr.toFixed(0) + '%';
document.getElementById('win-rate').className   = 'card-value ' + colorClass(wr - 50);
document.getElementById('win-bar-fill').style.width = Math.min(wr, 100) + '%';

// ── Equity Curve Chart ────────────────────────────────────────────────────────
if (curve && curve.length > 0) {
  const labels = curve.map(c => c.date);
  const baseline = 150000;
  // Prefer total_equity when recorded; fall back to baseline + cumulative_pnl
  const equities = curve.map(c => c.total_equity != null ? c.total_equity : baseline + (c.cumulative_pnl || 0));

  window._eqChart = new Chart(document.getElementById('equity-chart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Portfolio Equity',
        data: equities,
        borderColor: '#58a6ff',
        backgroundColor: 'rgba(88,166,255,0.08)',
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        fill: true,
        tension: 0.3,
      }, {
        label: 'Baseline $150k',
        data: labels.map(() => baseline),
        borderColor: 'rgba(125,133,144,0.4)',
        borderWidth: 1,
        borderDash: [4, 4],
        pointRadius: 0,
        fill: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#161b22',
          borderColor: '#30363d',
          borderWidth: 1,
          callbacks: {
            label: ctx => ' ' + fmt$(ctx.raw),
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(48,54,61,0.5)' },
          ticks: { color: '#7d8590', maxTicksLimit: 6, font: { size: 11 } }
        },
        y: {
          grid: { color: 'rgba(48,54,61,0.5)' },
          ticks: { color: '#7d8590', font: { size: 11 }, callback: v => fmt$(v) }
        }
      }
    }
  });
} else {
  document.getElementById('equity-chart').parentElement.innerHTML =
    '<div class="empty-state">No historical data yet — runs after first EOD</div>';
}

// ── Panel tab helpers ─────────────────────────────────────────────────────────
function openPanel(btn, type, grp) {
  const allTabs   = document.querySelectorAll('.panel-tab[data-grp="' + grp + '"]');
  const allBodies = document.querySelectorAll('.panel-body[data-grp="' + grp + '"]');
  const isActive  = btn.classList.contains('active');
  allTabs.forEach(t => t.classList.remove('active'));
  allBodies.forEach(b => b.classList.remove('active'));
  if (!isActive) {
    btn.classList.add('active');
    const body = document.getElementById(type + '-' + grp);
    if (body) body.classList.add('active');
  }
}

// ── News helpers ──────────────────────────────────────────────────────────────
function renderNewsItem(n) {
  const sc  = n.sentiment || 0;
  const cls = sc > 0.05 ? 'news-positive' : sc < -0.05 ? 'news-negative' : 'news-neutral';
  const lbl = sc > 0.05 ? '▲ ' + sc.toFixed(2) : sc < -0.05 ? '▼ ' + Math.abs(sc).toFixed(2) : '● ' + sc.toFixed(2);
  const href = n.url || ('https://duckduckgo.com/?q=' + encodeURIComponent(n.headline || ''));
  const hl   = `<a href="${href}" target="_blank" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)">${n.headline || ''}</a>`;
  return `<div class="news-item">
    <span class="news-sentiment ${cls}">${lbl}</span>
    <div class="news-body">
      <div class="news-headline">${hl}</div>
      <div class="news-meta">${n.source || ''}${n.published ? ' · ' + fmtDate(n.published) : ''}</div>
    </div>
  </div>`;
}
function newsItems(articles) {
  if (!articles || !articles.length) return '';
  return '<div class="news-list">' + articles.slice(0, 10).map(renderNewsItem).join('') + '</div>';
}

// ── Live price fetch via Finnhub (CORS-enabled) ───────────────────────────────
function _applyQuotes(quotes) {
  let unrealized = 0;
  let mktValue   = 0;
  quotes.forEach(q => {
    const el     = document.getElementById('lp-' + q.symbol);
    const entry  = parseFloat(el?.dataset.entry  || '0');
    const shares = parseFloat(el?.dataset.shares || '0');
    if (!el || q.price == null) return;
    const price = q.price;
    // Update table row price
    el.textContent = '$' + price.toFixed(2);
    el.className   = 'mono ' + (price >= entry ? 'positive' : 'negative');
    // Also update mobile card price (separate ID to avoid duplicate-ID conflicts)
    const cardEl = document.getElementById('clp-' + q.symbol);
    if (cardEl) {
      cardEl.textContent = '$' + price.toFixed(2);
      cardEl.className   = 'pos-price-val mono ' + (price >= entry ? 'positive' : 'negative');
    }
    if (entry && shares) {
      unrealized += (price - entry) * shares;
      mktValue   += price * shares;
    }
  });
  if (!mktValue) return;
  const cash       = port.cash || 0;
  const liveEquity = cash + mktValue;
  // port.cumulative_pnl is set by mark_to_market() as (total_equity − TOTAL_CAPITAL),
  // which already folds in unrealized P&L from the last EOD close.  Adding fresh
  // unrealized on top would double-count it.  Derive total P&L purely from live equity.
  const totalPnl   = liveEquity - (port.total_capital || 150000);
  document.getElementById('equity').textContent = fmt$(liveEquity);
  const pnlEl = document.getElementById('cum-pnl');
  pnlEl.textContent = fmtPnl(totalPnl);
  pnlEl.className   = 'card-value ' + colorClass(totalPnl);
  const subEl = document.getElementById('equity-sub');
  if (subEl) subEl.textContent = 'Unrealized: ' + fmtPnl(unrealized);
  // Update today's (last) point on the equity curve chart
  if (window._eqChart) {
    const ds = window._eqChart.data.datasets[0];
    ds.data[ds.data.length - 1] = liveEquity;
    window._eqChart.update('none');
  }
}
async function fetchLivePrices(syms) {
  const key = window.__FH_KEY__;
  if (!syms.length || !key) return;
  // Finnhub allows CORS from any origin — one request per symbol, all in parallel
  const results = await Promise.allSettled(
    syms.map(sym =>
      fetch('https://finnhub.io/api/v1/quote?symbol=' + sym + '&token=' + key)
        .then(r => r.ok ? r.json() : null)
        .then(d => d && d.c ? { symbol: sym, price: d.c } : null)
    )
  );
  const quotes = results
    .filter(r => r.status === 'fulfilled' && r.value)
    .map(r => r.value);
  if (quotes.length) _applyQuotes(quotes);
}

// ── Open Positions — card (mobile) + table (desktop) ─────────────────────────
const positions = port.positions || [];
const posEl = document.getElementById('positions-container');
if (positions.length > 0) {
  // Build shared data per position once, reuse in both views
  const posRows = positions.map((p, pidx) => {
    const entry      = Number(p.entry_price);
    const stored     = p.current_price != null ? Number(p.current_price) : null;
    const cost       = p.shares * entry;
    const curCls     = stored == null ? '' : stored >= entry ? 'positive' : 'negative';
    const curTxt     = stored == null ? '…' : '$' + stored.toFixed(2);
    const verdictCls = 'verdict-' + (p.verdict || 'watch').toLowerCase();
    const grp        = `pos-${pidx}`;
    const cgrp       = `cpos-${pidx}`;  // card-scoped IDs — no DOM conflicts
    const stopTxt    = p.stop_loss ? '$' + Number(p.stop_loss).toFixed(2) : '—';
    const tgtTxt     = p.target    ? '$' + Number(p.target).toFixed(2)    : '—';
    const scoreTxt   = p.composite_score ? Number(p.composite_score).toFixed(1) : '—';
    // Reusable panel HTML builder (works for both table rows and cards)
    const mkPanels = g => `
      <div class="panel-bar">
        ${p.bull_thesis ? `<button class="panel-tab bull-tab" data-grp="${g}" onclick="openPanel(this,'bull','${g}')" type="button">Bull case</button>` : ''}
        ${p.bear_risks  ? `<button class="panel-tab bear-tab" data-grp="${g}" onclick="openPanel(this,'bear','${g}')" type="button">Bear risks</button>` : ''}
        ${p.full_memo   ? `<button class="panel-tab memo-tab" data-grp="${g}" onclick="openPanel(this,'memo','${g}')" type="button">Risk Manager Verdict</button>` : ''}
        ${(p.full_news && p.full_news.length) ? `<button class="panel-tab news-tab" data-grp="${g}" onclick="openPanel(this,'news','${g}')" type="button">News (${p.full_news.length})</button>` : ''}
      </div>
      ${p.bull_thesis ? `<div class="panel-body thesis thesis-bull md" id="bull-${g}" data-grp="${g}">${thesisContent(p.bull_thesis)}</div>` : ''}
      ${p.bear_risks  ? `<div class="panel-body thesis thesis-bear md" id="bear-${g}" data-grp="${g}">${thesisContent(p.bear_risks)}</div>` : ''}
      ${p.full_memo   ? `<div class="panel-body thesis thesis-memo md" id="memo-${g}" data-grp="${g}">${memoContent(p.full_memo)}</div>` : ''}
      ${(p.full_news && p.full_news.length) ? `<div class="panel-body" id="news-${g}" data-grp="${g}">${newsItems(p.full_news)}</div>` : ''}`;
    return { p, entry, cost, curCls, curTxt, verdictCls, grp, cgrp,
              stopTxt, tgtTxt, scoreTxt, mkPanels };
  });

  // ── Mobile card view (shown at ≤640px via CSS) ──────────────────────────
  const cardsHtml = posRows.map(r => {
    const { p, entry, cost, curCls, curTxt, verdictCls, cgrp, stopTxt, tgtTxt, scoreTxt, mkPanels } = r;
    return `
    <div class="pos-card ${verdictCls}">
      <div class="pos-card-top">
        <div style="display:flex;align-items:center;gap:8px">
          <a href="https://finance.yahoo.com/quote/${p.symbol}" target="_blank" class="pos-card-sym">${p.symbol}</a>
          ${dirBadge(p.direction)}
        </div>
        <span style="font-size:0.72rem;color:var(--muted)">Score ${scoreTxt}</span>
      </div>
      <div class="pos-prices">
        <div><span class="pos-price-lbl">Entry</span><span class="pos-price-val mono">$${entry.toFixed(2)}</span></div>
        <div><span class="pos-price-lbl">Current</span><span class="pos-price-val mono ${curCls}" id="clp-${p.symbol}" data-entry="${entry}" data-shares="${p.shares}">${curTxt}</span></div>
        <div><span class="pos-price-lbl">Stop</span><span class="pos-price-val mono">${stopTxt}</span></div>
        <div><span class="pos-price-lbl">Target</span><span class="pos-price-val mono">${tgtTxt}</span></div>
      </div>
      <div class="pos-card-meta">${p.shares} sh · $${cost.toLocaleString('en-US',{maximumFractionDigits:0})} · ${p.entry_date || '—'}</div>
      <div class="reason">${p.reason || ''}</div>
      ${mkPanels(cgrp)}
    </div>`;
  }).join('');

  // ── Desktop table view (hidden at ≤640px via CSS) ────────────────────────
  const tableHtml = `<table>
    <thead><tr>
      <th>Symbol</th><th>Direction</th><th>Shares</th>
      <th>Cost</th><th>Entry</th><th>Current</th><th>Stop</th><th>Target</th><th>Score</th><th>Entered</th>
    </tr></thead>
    <tbody>
    ${posRows.map(r => {
      const { p, entry, cost, curCls, curTxt, verdictCls, grp, stopTxt, tgtTxt, scoreTxt, mkPanels } = r;
      return `
      <tr class="${verdictCls}">
        <td><strong><a href="https://finance.yahoo.com/quote/${p.symbol}" target="_blank" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)">${p.symbol}</a></strong></td>
        <td>${dirBadge(p.direction)}</td>
        <td class="mono">${p.shares}</td>
        <td class="mono">$${cost.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}</td>
        <td class="mono">$${entry.toFixed(2)}</td>
        <td class="mono ${curCls}" id="lp-${p.symbol}" data-entry="${entry}" data-shares="${p.shares}">${curTxt}</td>
        <td class="mono">${stopTxt}</td>
        <td class="mono">${tgtTxt}</td>
        <td>${scoreTxt}</td>
        <td>${p.entry_date || '—'}</td>
      </tr>
      <tr class="thesis-row"><td colspan="10">
        <div class="reason">${p.reason || ''}</div>
        ${mkPanels(grp)}
      </td></tr>`;
    }).join('')}
    </tbody>
  </table>`;

  posEl.innerHTML =
    `<div class="pos-mobile">${cardsHtml}</div>` +
    `<div class="pos-desktop tbl-scroll">${tableHtml}</div>`;

  fetchLivePrices(positions.map(p => p.symbol));
}

// ── Trade Log helpers ─────────────────────────────────────────────────────────
function renderEntries(entries, container) {
  if (!entries || entries.length === 0) {
    container.innerHTML = '<div class="empty-state">No entries</div>';
    return;
  }
  container.innerHTML = `<div class="tbl-scroll"><table>
    <thead><tr>
      <th>Date</th><th>Symbol</th><th>Verdict</th><th>Shares</th><th>Entry $</th><th>Cost</th><th>Stop</th><th>Target</th>
    </tr></thead>
    <tbody>
    ${entries.map((e, eidx) => {
      const grp = `ent-${eidx}`;
      return `
      <tr class="verdict-${(e.verdict || 'watch').toLowerCase()}">
        <td style="color:var(--muted);font-size:0.8rem">${e._date || e.entry_date || '—'}</td>
        <td><strong>${e.symbol}</strong> ${dirBadge(e.direction)}</td>
        <td>${badge(e.verdict)}</td>
        <td class="mono">${e.shares}</td>
        <td class="mono">$${Number(e.entry_price).toFixed(2)}</td>
        <td class="mono">$${e.cost ? Number(e.cost).toLocaleString('en-US', {maximumFractionDigits:0}) : '—'}</td>
        <td class="mono">${e.stop_loss ? '$' + Number(e.stop_loss).toFixed(2) : '—'}</td>
        <td class="mono">${e.target    ? '$' + Number(e.target).toFixed(2)    : '—'}</td>
      </tr>
      ${(e.reason || e.bull_thesis) ? `
      <tr class="thesis-row"><td colspan="8">
        <div class="reason">${e.reason || ''}</div>
        <div class="panel-bar">
          ${e.bull_thesis ? `<button class="panel-tab bull-tab" data-grp="${grp}" onclick="openPanel(this,'bull','${grp}')" type="button">Bull case</button>` : ''}
          ${e.bear_risks  ? `<button class="panel-tab bear-tab" data-grp="${grp}" onclick="openPanel(this,'bear','${grp}')" type="button">Bear risks</button>` : ''}
          ${e.full_memo   ? `<button class="panel-tab memo-tab" data-grp="${grp}" onclick="openPanel(this,'memo','${grp}')" type="button">Risk Manager Verdict</button>` : ''}
          ${(e.full_news && e.full_news.length) ? `<button class="panel-tab news-tab" data-grp="${grp}" onclick="openPanel(this,'news','${grp}')" type="button">News (${e.full_news.length})</button>` : ''}
        </div>
        ${e.bull_thesis ? `<div class="panel-body thesis thesis-bull md" id="bull-${grp}" data-grp="${grp}">${thesisContent(e.bull_thesis)}</div>` : ''}
        ${e.bear_risks  ? `<div class="panel-body thesis thesis-bear md" id="bear-${grp}" data-grp="${grp}">${thesisContent(e.bear_risks)}</div>` : ''}
        ${e.full_memo   ? `<div class="panel-body thesis thesis-memo md" id="memo-${grp}" data-grp="${grp}">${memoContent(e.full_memo)}</div>` : ''}
        ${(e.full_news && e.full_news.length) ? `<div class="panel-body" id="news-${grp}" data-grp="${grp}">${newsItems(e.full_news)}</div>` : ''}
      </td></tr>` : ''}
      `;
    }).join('')}
    </tbody>
  </table></div>`;
}

function renderExits(exits, container) {
  if (!exits || exits.length === 0) {
    container.innerHTML = '<div class="empty-state">No exits</div>';
    return;
  }
  container.innerHTML = `<div class="tbl-scroll"><table>
    <thead><tr>
      <th>Symbol</th><th>Dir</th><th>Shares</th><th>Entry $</th><th>Exit $</th><th>P&amp;L $</th><th>P&amp;L %</th><th>Reason</th>
    </tr></thead>
    <tbody>
    ${exits.map(e => {
      const pnl = e.pnl_dollars || 0;
      const cls = colorClass(pnl);
      return `
        <tr>
          <td><strong>${e.symbol}</strong></td>
          <td>${dirBadge(e.direction)}</td>
          <td class="mono">${e.shares}</td>
          <td class="mono">$${Number(e.entry_price).toFixed(2)}</td>
          <td class="mono">$${Number(e.exit_price).toFixed(2)}</td>
          <td class="mono ${cls}">${fmtPnl(pnl)}</td>
          <td class="mono ${cls}">${fmtPct(e.pnl_pct)}</td>
          <td style="color:var(--muted);font-size:0.8rem">${e.reason || '—'}</td>
        </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}

function renderRecentTrades(trades, container) {
  if (!trades || trades.length === 0) {
    container.innerHTML = '<div class="empty-state">No recent trades</div>';
    return;
  }
  const exits   = trades.filter(t => t._type === 'exit').slice(0, 50);
  const entries = trades.filter(t => t._type === 'entry').slice(0, 50);
  if (exits.length > 0) {
    // Show exits with P&L when available
    renderExits(exits, container);
  } else if (entries.length > 0) {
    // Fall back to showing entries if no exits yet
    renderEntries(entries, container);
  } else {
    container.innerHTML = '<div class="empty-state">No recent trades</div>';
  }
}

// ── Render trade tabs ─────────────────────────────────────────────────────────
const todayEntries = today.entries || [];
const todayExits   = today.exits   || [];

renderEntries(todayEntries, document.getElementById('entries-container'));
renderExits(todayExits,     document.getElementById('exits-container'));

renderRecentTrades(recent, document.getElementById('recent-container'));

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}
