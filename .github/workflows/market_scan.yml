name: QuantKnight Market Scan

# ── Schedule (5× per US trading day, Monday–Friday) ───────────────────────────
# All times UTC. EDT = UTC-4, EST = UTC-5.
# Runs even on market holidays — the pipeline itself handles no-data gracefully.
on:
  schedule:
    # 09:30 ET → 13:30 UTC (EDT)
    - cron: "30 13 * * 1-5"   # morning
    # 11:00 ET → 15:00 UTC
    - cron: "0 15 * * 1-5"    # midmorning
    # 13:00 ET → 17:00 UTC
    - cron: "0 17 * * 1-5"    # midday
    # 15:00 ET → 19:00 UTC
    - cron: "0 19 * * 1-5"    # preclose
    # 16:30 ET → 20:30 UTC
    - cron: "30 20 * * 1-5"   # eod

  # Manual trigger for debugging
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "morning"
        type: choice
        options: [morning, midmorning, midday, preclose, eod]

# ── Environment ────────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.12"
  TZ: "America/New_York"

jobs:
  quantknight:
    name: "${{ github.event.inputs.mode || 'scheduled' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

    # ── 1. Checkout with full history (needed for git push) ────────────────────
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    # ── 2. Determine run mode from cron or manual input ────────────────────────
    - name: Determine run mode
      id: mode
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
        else
          # Map UTC hour:minute → mode
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          TIME="${HOUR}${MIN}"
          if   [ "$TIME" -ge "1325" ] && [ "$TIME" -lt "1445" ]; then MODE="morning"
          elif [ "$TIME" -ge "1445" ] && [ "$TIME" -lt "1645" ]; then MODE="midmorning"
          elif [ "$TIME" -ge "1645" ] && [ "$TIME" -lt "1845" ]; then MODE="midday"
          elif [ "$TIME" -ge "1845" ] && [ "$TIME" -lt "2015" ]; then MODE="preclose"
          else MODE="eod"
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
        fi
        echo "Run mode: $MODE"

    # ── 3. Python setup ────────────────────────────────────────────────────────
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: "pip"

    # ── 4. Install dependencies ────────────────────────────────────────────────
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        # torch CPU-only on CI (saves 2 GB; MPS only available on Apple Silicon)
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    # ── 5. Restore SQLite DB from cache (persist between runs) ────────────────
    - name: Cache SQLite database
      uses: actions/cache@v4
      with:
        path: data/
        key: quantknight-data-${{ runner.os }}
        restore-keys: |
          quantknight-data-

    # ── 6. Create required directories ────────────────────────────────────────
    - name: Prepare directories
      run: |
        mkdir -p data/trades data/reports logs

    # ── 7. Run the pipeline ────────────────────────────────────────────────────
    - name: Run pipeline (${{ steps.mode.outputs.mode }})
      env:
        ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
        ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        FINNHUB_API_KEY:        ${{ secrets.FINNHUB_API_KEY }}
        HF_API_TOKEN:           ${{ secrets.HF_API_TOKEN }}
        TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
        GITHUB_ACTIONS:         "true"
        DATABASE_URL:           "sqlite:///data/quant_engine.db"
      run: |
        python -m pipeline.intraday_pipeline --mode ${{ steps.mode.outputs.mode }}

    # ── 8. Commit state back to repo ──────────────────────────────────────────
    - name: Commit portfolio state
      if: always()   # commit even if pipeline had non-fatal errors
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        bash scripts/commit_state.sh "${{ steps.mode.outputs.mode }}"

    # ── 9. Deploy dashboard to GitHub Pages (every run — live 5× daily) ─────────
    - name: Deploy dashboard to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./data/reports
        force_orphan: true
        commit_message: "dashboard: ${{ steps.mode.outputs.mode }} — ${{ github.run_number }}"

    # ── 10. Upload logs as artifact ───────────────────────────────────────────
    - name: Upload run logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
        path: logs/
        retention-days: 7
